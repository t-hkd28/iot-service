<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>センサーデータ一覧</title>
    <link rel="stylesheet" href="css/style.css">
    <script type="module" src="js/script.js"></script>
</head>

<body>
    <main class="container">
        <div class="scroll-container">
            <h1>センサーデータ一覧</h1>

            <form id="search-form">
                <label for="limit">取得件数</label>
                <input id="limit" name="limit" type="number" min="1" max="1000" value="100" required>
                <button type="submit">データ取得</button>
            </form>

            <p id="message">データを取得しています。</p>
            <p class="count">取得件数：<strong id="count">0</strong> 件</p>

            <table>
                <thead>
                    <tr>
                        <th>センサーID</th>
                        <th>種類</th>
                        <th>測定値</th>
                        <th>単位</th>
                        <th>測定日時</th>
                    </tr>
                </thead>
                <tbody id="sensor-list"></tbody>
            </table>
        </div>
    </main>
</body>

</html>
