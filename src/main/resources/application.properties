# 保存方式: JDBC または CSV
app.storage.type=${APP_STORAGE_TYPE:JDBC}
app.csv.path=${APP_CSV_PATH:./sensor-data.csv}
app.mqtt.enabled=${APP_MQTT_ENABLED:false}

# 開発環境設定。実習環境に合わせて環境変数で上書きする。
quarkus.datasource.db-kind=oracle
quarkus.datasource.username=${DB_USERNAME:}
quarkus.datasource.password=${DB_PASSWORD:}
quarkus.datasource.jdbc.url=${DB_JDBC_URL:jdbc:oracle:thin:@//localhost:1521/freepdb1}

mqtt.broker-url=${MQTT_BROKER_URL:tcp://localhost:1883}
mqtt.client-id=${MQTT_CLIENT_ID:iot-service}
mqtt.topic=${MQTT_TOPIC:iot/sensor}
mqtt.qos=${MQTT_QOS:1}
