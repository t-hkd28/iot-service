# 保存方式: JDBC または CSV
app.storage.type=${APP_STORAGE_TYPE:JDBC}
app.csv.path=${APP_CSV_PATH:./sensor-data.csv}

# 開発環境設定。実習環境に合わせて環境変数で上書きする。
%dev.quarkus.datasource.db-kind=oracle
%dev.quarkus.datasource.username=${DB_USERNAME:}
%dev.quarkus.datasource.password=${DB_PASSWORD:}
%dev.quarkus.datasource.jdbc.url=${DB_JDBC_URL:jdbc:oracle:thin:@//localhost:1521/freepdb1}

%dev.mqtt.broker-url=${MQTT_BROKER_URL:tcp://localhost:1883}
%dev.mqtt.client-id=${MQTT_CLIENT_ID:iot-trainee-01}
%dev.mqtt.topic=${MQTT_TOPIC:iot/sensor}
%dev.mqtt.qos=${MQTT_QOS:1}
